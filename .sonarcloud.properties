# SonarQube Cloud automatic analysis; do not add a second CI scanner.
# The Sonar quality gate remains advisory in GitHub.
sonar.sourceEncoding=UTF-8

# Explicit, disjoint source/test classification; tests remain analyzed.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,internal/store/storetest/**,**/testdata/**,**/test_*.py,**/tests.py,**/conftest.py,web/src/**/*.test.ts,web/src/**/*.test.tsx
# Mirror test patterns so no file is indexed as both source and test.
sonar.exclusions=**/*_test.go,internal/store/storetest/**,**/testdata/**,**/test_*.py,**/tests.py,**/conftest.py,web/src/**/*.test.ts,web/src/**/*.test.tsx
