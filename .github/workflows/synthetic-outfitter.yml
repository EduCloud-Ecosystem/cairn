name: Synthetic Outfitter consumer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-synthetic-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_IMAGE: python@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Checkout accepted broker source
        uses: actions/checkout@v7
        with:
          repository: EduCloud-Ecosystem/outfitter
          ref: 273bb0148fead33c91fcb92e0cc9e0bacdb929c2
          path: .runtime/outfitter-source
          persist-credentials: false
      - name: Build fixture client and broker
        run: |
          mkdir -p .runtime/bin
          go build -o .runtime/bin/cairn-outfitter-synthetic ./cmd/cairn-outfitter-synthetic
          cd .runtime/outfitter-source
          go build -o ../bin/outfitter ./cmd/outfitter
      - name: Prepare pinned public fixture image
        run: docker pull "$PYTHON_IMAGE"
      - name: Bounded synthetic consumer acceptance
        run: |
          python3 tools/synthetic-outfitter/verify.py \
            --cairn-binary .runtime/bin/cairn-outfitter-synthetic \
            --outfitter-binary .runtime/bin/outfitter \
            --image "$PYTHON_IMAGE" --output .runtime/cairn-outfitter-ci.json
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-outfitter-synthetic
          path: .runtime/cairn-outfitter-ci.json
          retention-days: 14
