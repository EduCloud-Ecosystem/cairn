# Continuous integration: run the checks a contributor is asked to run locally.
#
# One file, independent jobs. Go and the dashboard have no build-order dependency on
# each other, so they run in parallel and each reports its own status — a Go
# failure and a frontend failure are separately legible on the PR rather than
# hidden behind whichever tripped first. They live in one file because they are
# one gate ("does this change pass CI?"), and splitting them across files would
# make the shared triggers drift over time.
#
# Deliberately out of scope: no deployment or release workflow, and no gVisor.
# The isolation-tier tests assert the arguments the runner constructs rather
# than executing a live `runsc`, precisely so CI never needs it installed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the previous run irrelevant.
# main is excluded so pushes there always produce a complete, citable result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go:
    name: Go — build, vet, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: cairn_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d cairn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          # Exactly the version go.mod requires. Pinned rather than floating so
          # a toolchain bump is a visible commit, not a silent change in what
          # CI actually verified.
          go-version-file: go.mod
          # Caches the module and build caches, keyed on go.sum.
          cache: true

      # The PR template asks contributors for `gofmt -l .` clean, so CI checks
      # the same thing rather than leaving it to reviewers to eyeball.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -race is the norm in this repo and is kept here on purpose: the runner,
      # the provisioning queue, and the session store are all concurrent, and a
      # data race there is exactly the class of bug a non-race run misses.
      - name: go test (race)
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Changed-statement coverage evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          python3 tools/ci/analysis.py coverage --base "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-coverage
          path: |
            coverage.out
            ci-analysis/coverage-summary.json
          retention-days: 7

      - name: PostgreSQL conformance and atomic assessment publication
        env:
          CAIRN_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/cairn_test?sslmode=disable
        run: go test -race -tags postgres ./internal/store/postgres -count=1

  web:
    name: Dashboard — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 22 is the intersection of what the toolchain requires and what
          # actually ships this dashboard: Vite 7 needs ^20.19 || >=22.12,
          # Vitest 4 needs ^20 || ^22 || >=24, and the Dockerfile's web stage
          # builds on node:22-alpine. Matching the image means CI cannot pass on
          # a Node version the release build never uses.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci`, not `install`: a reproducible install from the committed lockfile,
      # which also fails loudly if package.json and package-lock.json disagree.
      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # `build` is a separate step from `test` on purpose — locally the two are
      # kept apart so a failing test stops a contributor without blocking the
      # production image build, and CI is where both are required together.
      - name: build
        run: npm run build

  curriculum:
    name: Curriculum — versioned contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check generated materials and release digests
        run: python3 tools/clustering_template.py --check
      - name: Test publication drift guards
        run: python3 -m unittest discover -s tools -v

  security:
    name: Security — vulnerabilities, workflow policy, property checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Known reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Dashboard dependency vulnerabilities
        working-directory: web
        run: npm audit --audit-level=high
      - name: Workflow static analysis
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -shellcheck=
      - name: Automation boundary tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Fuzz evidence path confinement and grade bounds
        run: |
          go test ./tools/ci/bench -run '^$' -fuzz '^FuzzArtifactPathConfinement$' -fuzztime=15s -parallel=2
          go test ./tools/ci/bench -run '^$' -fuzz '^FuzzGradeBounds$' -fuzztime=15s -parallel=2
          go test ./internal/lti -run '^$' -fuzz '^FuzzServiceURL$' -fuzztime=15s -parallel=2

  performance:
    name: Performance — matched baseline and profiling
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Compare identical harness on base and proposed source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach /tmp/cairn-base "$BASE_SHA"
          mkdir -p /tmp/cairn-base/tools/ci/bench
          cp tools/ci/bench/assessment_test.go /tmp/cairn-base/tools/ci/bench/assessment_test.go
          (cd /tmp/cairn-base && go test ./tools/ci/bench -run '^$' -bench . -benchtime=250ms -count=6 -benchmem) > baseline-bench.txt
          go test ./tools/ci/bench -run '^$' -bench . -benchtime=250ms -count=6 -benchmem > head-bench.txt
          python3 tools/ci/analysis.py benchmark --base "$BASE_SHA"
          go test ./tools/ci/bench -run '^$' -bench . -benchtime=1s -cpuprofile=ci-analysis/cpu.pprof -memprofile=ci-analysis/memory.pprof
          go tool pprof -top ci-analysis/cpu.pprof > ci-analysis/cpu-top.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-performance
          path: |
            ci-analysis/
            baseline-bench.txt
            head-bench.txt
          retention-days: 7

  container:
    name: Container — image vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the release image
        run: |
          docker build --pull -t cairn:ci .
          docker save -o cairn-image.tar cairn:ci
      - name: Scan image packages and embedded binary
        # Trivy 0.74.0, immutable image digest verified in the local rehearsal.
        # Only the image archive is mounted; no Docker socket, home or credentials.
        run: |
          docker run --rm \
            -v "$PWD/cairn-image.tar:/scan/image.tar:ro" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --format json > image-vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-image-security
          path: image-vulnerabilities.json
          retention-days: 7
