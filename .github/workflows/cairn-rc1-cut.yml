name: Publish verified Cairn control-plane v0.1.0-rc.1

on:
  push:
    branches: [codex/cairn-control-plane-v0-1-0-rc-1]
    paths: [.github/workflows/cairn-rc1-cut.yml]

permissions:
  actions: read
  packages: write

concurrency:
  group: cairn-control-plane-v0-1-0-rc-1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: v0.1.0-rc.1
      IMAGE: ghcr.io/educloud-ecosystem/cairn
      VERIFIED_RUN: '43973477343'
      VERIFIED_SUMS: d8dcaaf3729763fab8f182187cca4d5af9ff281a0491b1c35e92e40813a9e4e1
      VERIFIED_DIGEST: sha256:93b11edde04f283821806ee830d0a936be6268afd9433fe016e6cd8af3cf3563
    steps:
      - name: Download and verify the staged OCI bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          mkdir cairn-release
          cd cairn-release
          gh run download "$VERIFIED_RUN" -R "$GITHUB_REPOSITORY" -n cairn-v0.1.0-rc.1-linux-amd64
          printf '%s  SHA256SUMS\n' "$VERIFIED_SUMS" | sha256sum --check
          sha256sum --check SHA256SUMS
          test "$(cat OCI-DIGEST)" = "$VERIFIED_DIGEST"
          printf '%s  cairn-linux-amd64.manifest.json\n' "${VERIFIED_DIGEST#sha256:}" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import shutil
          import tarfile

          out = Path("layout")
          out.mkdir()
          with tarfile.open("cairn-" + os.environ["VERSION"] + "-linux-amd64.oci.tar") as archive:
              for member in archive:
                  field = member.name
                  if not member.isfile() or not (
                      field in {"index.json", "oci-layout"}
                      or re.fullmatch(r"blobs/sha256/[0-9a-f]{64}", field)
                  ):
                      raise ValueError("unexpected OCI package entry")
                  path = out / field
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as source, path.open("xb") as destination:
                      shutil.copyfileobj(source, destination)
          PY
      - name: Copy the exact manifest to the versioned registry reference
        if: github.run_attempt == 1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$auth_dir/auth.json" --username "$ACTOR" --password-stdin ghcr.io
          if skopeo inspect --authfile "$auth_dir/auth.json" "docker://$IMAGE:$VERSION" >"$auth_dir/existing.json" 2>"$auth_dir/existing.err"; then
            echo "The versioned tag already exists." >&2
            exit 1
          fi
          grep -Eiq 'manifest unknown|name unknown|not found|denied' "$auth_dir/existing.err" || { cat "$auth_dir/existing.err"; exit 1; }
          cd "$RUNNER_TEMP/cairn-release"
          skopeo inspect --raw "oci:layout:$VERSION" > "$auth_dir/oci.json"
          cmp "$auth_dir/oci.json" cairn-linux-amd64.manifest.json
          skopeo copy --preserve-digests --dest-authfile "$auth_dir/auth.json" --digestfile "$auth_dir/pushed" \
            "oci:layout:$VERSION" "docker://$IMAGE:$VERSION"
          test "$(cat "$auth_dir/pushed")" = "$VERIFIED_DIGEST"
          for ref in "$IMAGE:$VERSION" "$IMAGE@$VERIFIED_DIGEST"; do
            skopeo inspect --raw --authfile "$auth_dir/auth.json" "docker://$ref" > "$auth_dir/registry.json"
            cmp "$auth_dir/registry.json" cairn-linux-amd64.manifest.json
            printf 'Verified registry manifest for %s\n' "$ref"
          done
